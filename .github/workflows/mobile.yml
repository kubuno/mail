name: mobile

# The mobile app of this module (mobile/, a Cargo workspace; mobile/README.md): the portable app
# (mobile/common), the Android APK entry point (mobile/android) and the iOS entry point (mobile/ios).
# Tests the app and builds the APK on every change under mobile/. A tag mobile-v<version> builds the
# release APK and attaches it to a GitHub Release; the module's own v* tags keep releasing the server package.
#
# The shared mobile renderer and shells live in the core repository (core/mobile) and are referenced by path
# (../../core/mobile) until core publishes a mobile tag: CI checks both repositories out side by side.
# The iOS app is built on a Mac (not in this workflow).
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
    tags: ["mobile-v*"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

env:
  # The core revision the mobile app is built against (pin a tag once core publishes one).
  KUBUNO_CORE_REF: main

defaults:
  run:
    working-directory: mail/mobile

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: mail
          fetch-depth: 0

      - name: Check out the shared mobile renderer and shells (core)
        uses: actions/checkout@v4
        with:
          repository: kubuno/core
          ref: ${{ env.KUBUNO_CORE_REF }}
          path: core
          # mobile/ and the .kbview grammar it parses with (desktop/common/kubuno-desktop-views-syntax, whose
          # workspace manifest is desktop/Cargo.toml).
          sparse-checkout: |
            mobile
            desktop

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: The tag matches the app version
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          want="${GITHUB_REF_NAME#mobile-v}"
          have="$(sed -n '/\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)".*/\1/p' Cargo.toml)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but the workspace version is $have"; exit 1; }

      - name: Tests (the portable app)
        run: cargo test -p kubuno-mail-mobile-common

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build the debug APK
        working-directory: mail/mobile/android/kubuno-mail-mobile-android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo apk build --target aarch64-linux-android --target x86_64-linux-android

      - uses: actions/upload-artifact@v4
        with:
          name: kubuno-mail-android-debug
          path: mail/mobile/target/debug/apk/*.apk

      - name: Build the release APK
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        working-directory: mail/mobile/android/kubuno-mail-mobile-android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo apk build --release --target aarch64-linux-android --target x86_64-linux-android
          cd ../../target/release/apk
          for f in *.apk; do mv "$f" "kubuno-mail-android-${GITHUB_REF_NAME#mobile-v}.apk"; done

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Kubuno Mail ${{ github.ref_name }}"
          files: mail/mobile/target/release/apk/*.apk
          generate_release_notes: true
