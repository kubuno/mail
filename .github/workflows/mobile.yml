name: mobile

# The mobile app of this module (mobile/, Gradle root; mobile/README.md).
# Builds and tests it on every change under mobile/. A tag mobile-v<versionName>
# builds the release APK and attaches it to a GitHub Release; the module's own v*
# tags keep releasing the server package.
#
# The shared libraries (com.kubuno.mobile:*) are published to the private Kubuno
# Maven registry, out of reach of GitHub runners: CI checks the core out at the tag
# mobile-v<kubunoMobile> pinned in gradle/libs.versions.toml and substitutes them
# from source (composite build) - the same version, built from its tag.
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
    tags: ["mobile-v*"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pinned version of the shared libraries
        id: libs
        run: echo "version=$(sed -n 's/^kubunoMobile *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Check out the shared libraries (core, tag mobile-v${{ steps.libs.outputs.version }})
        uses: actions/checkout@v4
        with:
          repository: kubuno/core
          ref: mobile-v${{ steps.libs.outputs.version }}
          path: _core
          sparse-checkout: mobile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: The tag matches the app version
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          want="${GITHUB_REF_NAME#mobile-v}"
          have="$(sed -n 's/^ *versionName *= *"\(.*\)"/\1/p' android/app/build.gradle.kts)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but versionName=$have"; exit 1; }

      - name: Unit tests
        run: ./gradlew test
        env:
          KUBUNO_CORE_MOBILE: ${{ github.workspace }}/_core/mobile

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug
        env:
          KUBUNO_CORE_MOBILE: ${{ github.workspace }}/_core/mobile

      - uses: actions/upload-artifact@v4
        with:
          name: kubuno-mail-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Assemble the release APK (unsigned)
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          ./gradlew :app:assembleRelease
          cd android/app/build/outputs/apk/release
          for f in *.apk; do mv "$f" "kubuno-mail-android-${GITHUB_REF_NAME#mobile-v}-${f#app-}"; done
        env:
          KUBUNO_CORE_MOBILE: ${{ github.workspace }}/_core/mobile

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Kubuno Mail ${{ github.ref_name }}"
          files: mobile/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
