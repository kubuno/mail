# JVM & Gradle performance
# Modest heaps on purpose: several JVMs run at once (Gradle, Kotlin daemon, KSP)
# and oversized -Xmx crashed the daemon with a native OOM (Chunk::new) on a
# machine whose commit charge runs close to its limit.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
